<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Log In To OctoCam</title>
    <link rel="stylesheet" href="/static/styles.css?v=20260730-shadcn-tokens">
  </head>
  <body>
    <main class="setup-shell">
      {% if failed %}
        <p class="notice setup-notice">Invalid username or password.</p>
      {% endif %}
      <p id="passkeyNotice" class="notice setup-notice" hidden></p>

      <form class="panel setup-panel" method="post" action="/login?next={{ next_query }}">
        <p class="eyebrow">OctoCam</p>
        <h1>Log in</h1>

        <label>
          <span>Username</span>
          <input name="username" type="text" value="admin" autocomplete="username webauthn" required>
        </label>

        <label>
          <span>Password</span>
          <input name="password" type="password" autocomplete="current-password" required>
        </label>

        <button class="primary" type="submit">Log in</button>
        <button type="button" id="passkeyLoginBtn" class="secondary">Sign in with a passkey</button>
      </form>
    </main>

    <script>
      const passkeyBtn = document.getElementById('passkeyLoginBtn');
      const passkeyNotice = document.getElementById('passkeyNotice');

      async function performPasskeyLogin(mediationMode = 'optional') {
        try {
          passkeyNotice.hidden = true;
          const startRes = await fetch('/api/passkey/login/start', { method: 'POST' });
          if (!startRes.ok) throw new Error('Failed to initiate passkey login');
          const data = await startRes.json();

          const challengeBuffer = base64urlToBuffer(data.publicKey.challenge);
          data.publicKey.challenge = challengeBuffer;
          if (data.publicKey.allowCredentials) {
            data.publicKey.allowCredentials = data.publicKey.allowCredentials.map(c => ({
              ...c,
              id: base64urlToBuffer(c.id)
            }));
          }

          const options = { publicKey: data.publicKey };
          if (mediationMode === 'conditional' && window.PublicKeyCredential && PublicKeyCredential.isConditionalMediationAvailable) {
            const isCMA = await PublicKeyCredential.isConditionalMediationAvailable();
            if (isCMA) {
              options.mediation = 'conditional';
            } else {
              return;
            }
          }

          const cred = await navigator.credentials.get(options);
          if (!cred) return;

          const finishRes = await fetch('/api/passkey/login/finish', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              challenge_id: data.challenge_id,
              id: cred.id,
              rawId: bufferToBase64url(cred.rawId),
              response: {
                clientDataJSON: bufferToBase64url(cred.response.clientDataJSON),
                authenticatorData: bufferToBase64url(cred.response.authenticatorData),
                signature: bufferToBase64url(cred.response.signature),
                userHandle: cred.response.userHandle ? bufferToBase64url(cred.response.userHandle) : null
              }
            })
          });

          const finishData = await finishRes.json();
          if (finishData.success) {
            window.location.href = finishData.redirect || '/';
          } else {
            if (mediationMode !== 'conditional') {
              showError(finishData.error || 'Passkey authentication failed');
            }
          }
        } catch (err) {
          if (err.name !== 'NotAllowedError' && err.name !== 'AbortError') {
            if (mediationMode !== 'conditional') {
              showError(err.message || 'Passkey login error');
            }
          }
        }
      }

      if (window.PublicKeyCredential) {
        passkeyBtn.addEventListener('click', () => performPasskeyLogin('optional'));
        performPasskeyLogin('conditional');
      } else {
        passkeyBtn.hidden = true;
      }

      function showError(msg) {
        passkeyNotice.textContent = msg;
        passkeyNotice.hidden = false;
      }

      function base64urlToBuffer(base64url) {
        let base64 = base64url.replace(/-/g, '+').replace(/_/g, '/');
        while (base64.length % 4) base64 += '=';
        const raw = window.atob(base64);
        const buf = new Uint8Array(raw.length);
        for (let i = 0; i < raw.length; i++) buf[i] = raw.charCodeAt(i);
        return buf.buffer;
      }

      function bufferToBase64url(buffer) {
        const bytes = new Uint8Array(buffer);
        let binary = '';
        for (let i = 0; i < bytes.byteLength; i++) binary += String.fromCharCode(bytes[i]);
        return window.btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=/g, '');
      }
    </script>
  </body>
</html>
